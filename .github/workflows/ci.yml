name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # continuo-validation-contract resolves from PyPI (==0.4.0).
      - name: Sync
        run: uv sync --all-packages --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Types (runtime)
        run: uv run mypy continuo_python_runtime
      - name: Types (postgres adapter)
        run: uv run --package continuo-python-runtime-postgres mypy adapters/postgres/continuo_python_runtime_postgres
      - name: Types (trino adapter)
        run: uv run --package continuo-python-runtime-trino mypy adapters/trino/continuo_python_runtime_trino
      - name: Tests (runtime)
        run: uv run pytest --cov=continuo_python_runtime -v
      - name: Tests (adapter units)
        run: uv run pytest adapters/postgres/tests adapters/trino/tests -m "not integration" -v
