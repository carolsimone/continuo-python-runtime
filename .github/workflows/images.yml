name: images

# Pull-request path. Builds the wheels of the PR's commit, installs them into
# the clean-venv package gate and into every engine image, and smoke-tests each
# image, on BOTH linux/amd64 and linux/arm64 (native runners, no QEMU).
#
# The checks themselves live in the reusable workflows verify-packages.yml,
# image-build.yml and image-smoke.yml, which publish-pypi.yml (the tag-triggered
# release pipeline) also calls: the PR path and the release path run the same
# definitions, so they cannot drift. Releases are NOT built here any more; see
# publish-pypi.yml.
#
# None of these jobs is a required status check (this workflow is path-filtered,
# so requiring one would leave unrelated PRs pending forever).
on:
  pull_request:
    paths:
      - "Dockerfile.*"
      - "tests/smoke/**"
      - "tests/test_image_smoke_validation.py"
      - "image-requirements-*.txt"
      - "continuo_python_runtime/**"
      - "contract/**"
      - "adapters/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/images.yml"
      - ".github/workflows/image-build.yml"
      - ".github/workflows/image-smoke.yml"
      - ".github/workflows/verify-packages.yml"

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build the sdists and wheels of all five packages
        run: uv build --all-packages -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          overwrite: true

  verify-packages:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, trino, duckdb]
        arch: [amd64, arm64]
    uses: ./.github/workflows/verify-packages.yml
    with:
      engine: ${{ matrix.engine }}
      arch: ${{ matrix.arch }}

  build:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, trino, duckdb]
        arch: [amd64, arm64]
    uses: ./.github/workflows/image-build.yml
    with:
      engine: ${{ matrix.engine }}
      arch: ${{ matrix.arch }}
      wheel_source: wheelhouse
      push: false
      artifact_prefix: pr

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, trino, duckdb]
        arch: [amd64, arm64]
    uses: ./.github/workflows/image-smoke.yml
    with:
      engine: ${{ matrix.engine }}
      arch: ${{ matrix.arch }}
      mode: tar
      image_artifact: pr-${{ matrix.engine }}-${{ matrix.arch }}
