name: images
on:
  pull_request:
    paths:
      - "Dockerfile.*"
      - "tests/smoke/**"
      - "continuo_python_runtime/**"
      - "contract/**"
      - "adapters/**"
      - "pyproject.toml"
      - ".github/workflows/images.yml"
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        engine: [postgres, trino]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build wheels into a wheelhouse
        run: uv build --all-packages -o wheelhouse
      - name: Build ${{ matrix.engine }} image
        run: docker build -f Dockerfile.${{ matrix.engine }} --build-arg WHEEL_SOURCE=wheelhouse -t cpr-smoke-${{ matrix.engine }} .
      - name: Save image
        run: docker save cpr-smoke-${{ matrix.engine }} -o /tmp/cpr-smoke-${{ matrix.engine }}.tar
      - uses: actions/upload-artifact@v7
        with:
          name: cpr-smoke-${{ matrix.engine }}-image
          path: /tmp/cpr-smoke-${{ matrix.engine }}.tar
          retention-days: 1

  smoke-postgres:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuo
          POSTGRES_PASSWORD: continuo
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuo -d warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cpr-smoke-postgres-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/cpr-smoke-postgres.tar
      - uses: astral-sh/setup-uv@v7
      - name: Sync
        run: uv sync --all-packages --all-groups
      - name: Image smoke tests (postgres)
        env:
          VALIDATION_IMAGE_UNDER_TEST: cpr-smoke-postgres
          VALIDATION_IMAGE_ENGINE: postgres
          # PostgresAdapter.required_env()[0]
          VALIDATION_IMAGE_REQUIRED_ENV: POSTGRES_HOST
        run: uv run pytest tests/test_image_smoke_validation.py -m image -v
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Seed source table
        env:
          PGPASSWORD: continuo
        run: |
          psql -h localhost -U continuo -d warehouse -c \
            "CREATE SCHEMA analytics; CREATE TABLE analytics.src(id int); INSERT INTO analytics.src VALUES (1),(2),(3);"
      - name: Run smoke node
        run: |
          docker run --rm --network host \
            -v "$PWD/tests/smoke/node_smoke:/app" \
            -e NODE_ID=python-model.smoke.analytics.smoke \
            -e TABLE_NAME=smoke \
            -e TARGET_SCHEMA=analytics \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=warehouse \
            -e POSTGRES_USER=continuo \
            -e POSTGRES_PASSWORD=continuo \
            cpr-smoke-postgres | tee /tmp/smoke.out
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Assert success sentinel
        run: grep -q '"status":"success"' /tmp/smoke.out
      - name: Assert row count
        env:
          PGPASSWORD: continuo
        run: |
          count=$(psql -h localhost -U continuo -d warehouse -t -c "select count(*) from analytics.smoke" | tr -d '[:space:]')
          test "$count" = "3"

  smoke-trino:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cpr-smoke-trino-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/cpr-smoke-trino.tar
      - uses: astral-sh/setup-uv@v7
      - name: Sync
        run: uv sync --all-packages --all-groups
      - name: Image smoke tests (trino)
        env:
          VALIDATION_IMAGE_UNDER_TEST: cpr-smoke-trino
          VALIDATION_IMAGE_ENGINE: trino
          # TrinoAdapter.required_env()[0]
          VALIDATION_IMAGE_REQUIRED_ENV: TRINO_HOST
        run: uv run pytest tests/test_image_smoke_validation.py -m image -v
      - name: Start trino stack
        run: docker compose -f tests/smoke/trino-stack/docker-compose.yml up -d --wait
      - name: Seed source table
        run: |
          docker exec "$(docker compose -f tests/smoke/trino-stack/docker-compose.yml ps -q trino)" \
            trino --execute "CREATE SCHEMA IF NOT EXISTS iceberg.analytics; CREATE TABLE iceberg.analytics.src(id int); INSERT INTO iceberg.analytics.src VALUES 1,2,3"
      - name: Run smoke node
        run: |
          docker run --rm \
            -v "$PWD/tests/smoke/node_smoke:/app" \
            -e NODE_ID=python-model.smoke.analytics.smoke \
            -e TABLE_NAME=smoke \
            -e TARGET_SCHEMA=analytics \
            -e TRINO_HOST=host.docker.internal \
            -e TRINO_PORT=18080 \
            -e TRINO_CATALOG=iceberg \
            -e TRINO_USER=continuo \
            --add-host=host.docker.internal:host-gateway \
            cpr-smoke-trino | tee /tmp/smoke-trino.out
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Assert success sentinel
        run: grep -q '"status":"success"' /tmp/smoke-trino.out
      - name: Assert row count
        run: |
          count=$(docker exec "$(docker compose -f tests/smoke/trino-stack/docker-compose.yml ps -q trino)" \
            trino --execute "select count(*) from iceberg.analytics.smoke" | tr -d '[:space:]"')
          test "$count" = "3"
      - name: Tear down trino stack
        if: always()
        run: docker compose -f tests/smoke/trino-stack/docker-compose.yml down -v

  # Runs on this same tag push, after the smoke jobs above pass. It builds both
  # engine images for linux/amd64 and linux/arm64 installing the pinned
  # versions FROM PyPI (WHEEL_SOURCE=pypi, the Dockerfile default), then
  # pushes them to ghcr.io/<owner>/continuo-python-runtime-<engine>:<tag>. The
  # engine belongs in the image NAME, not the tag: Continuo's Helm chart pins
  # an image as `<name>:vX.Y.Z@sha256:<digest>`, so the tag must be the bare
  # version. Both platforms are required: domain repos build their own images
  # FROM these, and Continuo's e2e runs them in a kind cluster on aarch64
  # developer machines as well as on amd64 CI runners, so a single-arch
  # publish is unusable off amd64. The smoke jobs above stay single-arch —
  # they load a `docker save` tarball, which has no multi-platform
  # equivalent.
  #
  # publish-pypi.yml runs in parallel on this same tag push, not before this
  # job: there is no cross-workflow `needs:`, so this job cannot wait on that
  # workflow directly. Instead the wait-until-installable step below polls
  # PyPI until the pinned versions this tag just published are actually
  # installable, which is what orders this build after publish-pypi.yml
  # completes without a cross-workflow dependency.
  # -test tags publish to TestPyPI only (see publish-pypi.yml), so this job
  # skips them: there is no real-PyPI installable version to build an image
  # from for those.
  publish:
    needs: [smoke-postgres, smoke-trino]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test')
    strategy:
      matrix:
        engine: [postgres, trino]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfiles unconditionally COPY ./wheelhouse (see Dockerfile.postgres
      # / Dockerfile.trino); this build installs from PyPI (WHEEL_SOURCE
      # defaults to pypi below), so the directory only needs to exist, not
      # contain anything.
      - name: Create empty wheelhouse (release installs from PyPI, not this dir)
        run: mkdir -p wheelhouse
      - name: Wait until the pinned versions are installable from PyPI
        run: |
          set -eu
          req="image-requirements-${{ matrix.engine }}.txt"
          for i in $(seq 1 30); do
            if pip download --dest /tmp/probe -r "$req" >/tmp/probe.log 2>&1; then
              echo "installable"; exit 0
            fi
            echo "attempt $i: not yet on index; sleeping"; sleep 20
          done
          echo "pinned versions never became installable"; cat /tmp/probe.log; exit 1
      - name: Build and push ${{ matrix.engine }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.engine }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/continuo-python-runtime-${{ matrix.engine }}:${{ github.ref_name }}
