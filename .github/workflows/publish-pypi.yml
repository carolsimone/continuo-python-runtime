name: publish-pypi

# Publishes the continuo-python-runtime package via PyPI Trusted Publishing
# (OIDC, no stored token).
#
# The two engine adapters (continuo-python-runtime-postgres /
# continuo-python-runtime-trino) are deliberately NOT published here. Nothing
# installs them from an index: the runtime images build them from the build
# context (see Dockerfile.postgres / Dockerfile.trino and images.yml), and the
# harness package does not depend on them — adapters are found at run time
# through the `continuo_runtime.adapters` entry-point group, inside the image
# that installed exactly one. Publishing them would only add releases with no
# consumer. They remain uv workspace members and are still built, typed, and
# tested by ci.yml.
#
# Tag glob note: "python-runtime-v*" requires a literal "v" immediately after
# the dash, so it matches only the harness tag (python-runtime-v1.2.3[-testN]).
# Tag `<pkg>-v<ver>-test<n>` publishes to TestPyPI; `<pkg>-v<ver>` publishes to
# real PyPI. The GitHub environment name is what the PyPI "pending publisher"
# is registered against.
#
# Ordering: continuo-validation-contract==0.4.0 must exist on the target index
# before publishing here — consumers of the wheel resolve it from that index
# ([tool.uv.sources] is dev-only and not embedded in the wheel).
on:
  push:
    tags:
      - "python-runtime-v*"

permissions: {}

jobs:
  publish-runtime:
    if: startsWith(github.ref_name, 'python-runtime-v')
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-test') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read # actions/checkout needs read access to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test before publishing
        run: |
          uv sync --all-groups
          uv run pytest -q
      - name: Build the sdist + wheel
        run: uv build -o dist
      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
