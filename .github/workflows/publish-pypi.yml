name: publish-pypi

# Publishes the continuo-python-runtime package (and, in the two adapter jobs
# below, the continuo-python-runtime-postgres / continuo-python-runtime-trino
# packages) via PyPI Trusted Publishing (OIDC, no stored token).
#
# Tag glob note: "python-runtime-v*" requires a literal "v" immediately after
# the dash, so it matches only the harness tag (python-runtime-v1.2.3[-testN])
# and never "python-runtime-postgres-v*" / "python-runtime-trino-v*" (whose
# char after the shared "python-runtime-" prefix is "p"/"t", not "v") — the
# three globs are disjoint, so none of the three jobs below shadows another.
# Tag `<pkg>-v<ver>-test<n>` publishes to TestPyPI; `<pkg>-v<ver>` publishes to
# real PyPI. The GitHub environment name is what each PyPI "pending publisher"
# is registered against.
#
# Ordering: continuo-validation-contract==0.3.0 must exist on the target index
# before publishing here — consumers of the wheel resolve it from that index
# ([tool.uv.sources] is dev-only and not embedded in the wheel).
on:
  push:
    tags:
      - "python-runtime-v*"
      - "python-runtime-postgres-v*"
      - "python-runtime-trino-v*"

permissions: {}

jobs:
  publish-runtime:
    if: startsWith(github.ref_name, 'python-runtime-v')
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-test') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read # actions/checkout needs read access to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test before publishing
        run: |
          uv sync --all-groups
          uv run pytest -q
      - name: Build the sdist + wheel
        run: uv build -o dist
      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish-runtime-postgres:
    if: startsWith(github.ref_name, 'python-runtime-postgres-v')
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-test') && 'testpypi-postgres' || 'pypi-postgres' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read # actions/checkout needs read access to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test before publishing
        run: |
          uv sync --all-packages --all-groups
          uv run pytest python-runtime-postgres/tests -m "not integration" -q
      - name: Build the sdist + wheel
        run: uv build --package continuo-python-runtime-postgres python-runtime-postgres -o dist
      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish-runtime-trino:
    if: startsWith(github.ref_name, 'python-runtime-trino-v')
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-test') && 'testpypi-trino' || 'pypi-trino' }}
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: read # actions/checkout needs read access to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test before publishing
        run: |
          uv sync --all-packages --all-groups
          uv run pytest python-runtime-trino/tests -m "not integration" -q
      - name: Build the sdist + wheel
        run: uv build --package continuo-python-runtime-trino python-runtime-trino -o dist
      - name: Publish to TestPyPI
        if: contains(github.ref_name, '-test')
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-test') }}
        # Pinned to a commit SHA. release/v1 is a moving branch, and this job
        # holds id-token: write for PyPI Trusted Publishing — a compromised
        # revision could mint a token and publish under this project's name.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
