[project]
version = "0.1.0"
name = "continuo-duckdb-adapter"
description = "DuckDB (DuckLake) warehouse adapter for Continuo: validation and python-node runtime."
authors = [{ name = "Simone Carolini" }]
maintainers = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    # Pinned exactly for the same reason as the postgres adapter: the
    # [tool.uv.sources] redirect below is uv-only and never reaches built
    # metadata, and this adapter subclasses the contract's port directly.
    "continuo-engine-contract==0.7.3",
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."continuo_engine.adapters"]
duckdb = "continuo_duckdb_adapter.adapter:DuckDBAdapter"

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Integration tests read the DuckLake catalog (postgres) and the data
    # files (MinIO) directly to prove layout was really applied.
    "psycopg2-binary==2.9.12",
    "boto3==1.43.104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_duckdb_adapter"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Kept in lockstep with the root pyproject's select -- see the note there.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
strict = false

[tool.uv.sources]
continuo-engine-contract = { workspace = true }
