[project]
version = "0.2.0"
name = "continuo-python-runtime-postgres"
description = "Postgres warehouse adapter for Continuo: validation and python-node runtime."
authors = [{ name = "Simone Carolini" }]
maintainers = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    # Pinned for the same reason as the root package: [tool.uv.sources] below is
    # a uv-only redirect that never reaches built metadata, so any distribution
    # of this adapter would otherwise accept whatever contract release is
    # newest. This adapter subclasses the contract's WarehouseAdapter port
    # directly, so the pair must stay the tested one.
    "continuo-engine-contract==0.7.2",
    "psycopg2-binary==2.9.12",
    "pyarrow==25.0.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."continuo_engine.adapters"]
postgres = "continuo_python_runtime_postgres.adapter:PostgresAdapter"

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy==2.3.1",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_python_runtime_postgres"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Kept in lockstep with the root pyproject's select — see the note there.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
strict = false

[tool.uv.sources]
continuo-engine-contract = { workspace = true }
