[project]
version = "0.2.0"
name = "continuo-python-runtime-postgres"
description = "Postgres warehouse adapter for Continuo: validation and python-node runtime."
authors = [{ name = "Simone Carolini" }]
maintainers = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "continuo-engine-contract",
    "psycopg2-binary==2.9.11",
    "pyarrow==25.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."continuo_engine.adapters"]
postgres = "continuo_python_runtime_postgres.adapter:PostgresAdapter"

[dependency-groups]
dev = [
    "ruff==0.3.0",
    "mypy==1.18.2",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_python_runtime_postgres"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.14"
strict = false

[tool.uv.sources]
continuo-engine-contract = { workspace = true }
