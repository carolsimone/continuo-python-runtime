[project]
version = "0.2.0"
name = "continuo-python-runtime-trino"
description = "Trino warehouse adapter for Continuo: validation and python-node runtime."
authors = [{ name = "Simone Carolini" }]
maintainers = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    # Pinned for the same reason as the root package: [tool.uv.sources] below is
    # a uv-only redirect that never reaches built metadata, so any distribution
    # of this adapter would otherwise accept whatever contract release is
    # newest. This adapter subclasses the contract's WarehouseAdapter port
    # directly, so the pair must stay the tested one.
    "continuo-engine-contract==0.7.2",
    "trino==0.338.0",
    "pyarrow==25.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."continuo_engine.adapters"]
trino = "continuo_python_runtime_trino.adapter:TrinoAdapter"

[dependency-groups]
dev = [
    "ruff==0.3.0",
    "mypy==1.18.2",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_python_runtime_trino"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.14"
strict = false

[tool.uv.sources]
continuo-engine-contract = { workspace = true }
