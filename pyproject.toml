[project]
name = "continuo-python-runtime"
version = "0.1.0"
description = "Runtime harness, contract tooling, and CI lint for Continuo python nodes."
authors = [{ name = "Simone Carolini" }]
maintainers = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "continuo-validation-contract==0.3.0",
    "pyarrow==25.0.0",
    "PyYAML==6.0.3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
continuo-runtime = "continuo_python_runtime.cli:main"

[dependency-groups]
dev = ["ruff==0.3.0", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915"]
test = ["pytest==9.0.3", "pytest-cov==4.1.0"]

[tool.uv.sources]
# Git source pinned at the continuo PR #380 merge commit (validation-contract 0.3.0).
# Replaced with a plain PyPI pin in PR 9 once 0.3.0 publishes.
continuo-validation-contract = { git = "https://github.com/carolsimone/continuo", subdirectory = "validation-contract", rev = "d414c8a4c27f16dcc3e067e00fd70af22b3c35ef" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_python_runtime"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.14"
strict = false
