[project]
version = "0.2.0"
name = "continuo-python-runtime-trino"
description = "Trino runtime adapter for Continuo python nodes."
authors = [{ name = "Simone Carolini" }]
maintainers = [{ name = "Simone Carolini" }]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "continuo-validation-contract==0.4.0",
    "trino==0.338.0",
    "pyarrow==25.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."continuo_runtime.adapters"]
trino = "continuo_python_runtime_trino.adapter:TrinoRuntimeAdapter"

[dependency-groups]
dev = [
    "ruff==0.3.0",
    "mypy==1.18.2",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_python_runtime_trino"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.14"
strict = false
