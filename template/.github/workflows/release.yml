name: release
on:
  push: { branches: [main] }
# A run that is waiting for continuo's verdict must not be cancelled by a newer
# push: the release it submitted keeps going in continuo regardless, and the job
# would stop reporting its outcome. Runs queue instead, and continuo supersedes
# an older release when a newer one is promoted.
concurrency:
  group: release
  cancel-in-progress: false
env:
  SERVICE: your-service-name          # one service name per domain repo
  # Repository variable RELEASE_ENDPOINT: the origin of continuo's `auth.publicUrl`,
  # exactly: lowercase host, no default port, no path (e.g. https://continuo.example.com).
  # It is also the OIDC audience, which assumes continuo's default `ciAuth.audience`.
  # This repository must be bound to $SERVICE in continuo's `ciAuth.bindings`.
  RELEASE_ENDPOINT: ${{ vars.RELEASE_ENDPOINT }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      # Fail before building anything when the endpoint is missing or malformed.
      # The whole value must match: one line, no whitespace, no credentials, no
      # path. CONTINUO_ORIGIN (the endpoint without a trailing slash) is both the
      # API base and the OIDC audience. The value is never echoed.
      - name: Check release endpoint
        run: |
          if [ -z "$RELEASE_ENDPOINT" ]; then
            echo "::error::repository variable RELEASE_ENDPOINT is not set; set it to continuo's base URL (scheme://host)"
            exit 1
          fi
          origin_re='^https?://[^/?#@[:space:]]+/?$'
          if ! [[ $RELEASE_ENDPOINT =~ $origin_re ]]; then
            echo "::error::RELEASE_ENDPOINT must be continuo's base URL as scheme://host[:port]: one line, no path, no credentials"
            exit 1
          fi
          echo "CONTINUO_ORIGIN=${RELEASE_ENDPOINT%/}" >> "$GITHUB_ENV"
      # Fail before building anything when the URL, the token audience or the
      # repository binding is wrong: an authenticated read of /api/v1/current-prod
      # is refused (401 or 403) unless the repository is bound in `ciAuth.bindings`.
      # Also writes the helpers the submit step reuses. Every call asks for a fresh
      # OIDC token (they expire within minutes) and passes it to curl only as a
      # header read from stdin, so it never reaches a log or a process listing.
      - name: Preflight continuo API
        run: |
          cat > "$RUNNER_TEMP/continuo-api.sh" <<'HELPERS'
          oidc_token() {
            local aud
            aud="$(jq -rn --arg a "$CONTINUO_ORIGIN" '$a | @uri')"
            printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              | curl -sS --fail -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" \
              | jq -er '.value'
          }

          # call METHOD PATH [BODY]: prints the HTTP status (000 when curl or the
          # token request failed); the response body is left in $resp.
          call() {
            local method="$1" path="$2" body="${3:-}" token out
            token="$(oidc_token)" || { echo "could not request a GitHub Actions OIDC token" >&2; echo 000; return 0; }
            local -a args=(-sS -X "$method" -o "$resp" -w '%{http_code}' -H @- -H 'Accept: application/json')
            [ -z "$body" ] || args+=(-H 'Content-Type: application/json' -d "$body")
            out="$(printf 'Authorization: Bearer %s\n' "$token" | curl "${args[@]}" "${CONTINUO_ORIGIN}${path}" || true)"
            echo "${out:-000}"
          }

          fail_with_response() {
            echo "::error::$1: HTTP $2 $(jq -r '"code=\(.code // "unknown") error=\(.error // "none")"' "$resp" 2>/dev/null || true)"
            exit 1
          }
          HELPERS

          resp="$(mktemp)"
          trap 'rm -f "$resp"' EXIT
          . "$RUNNER_TEMP/continuo-api.sh"
          for attempt in 1 2 3; do
            status="$(call GET /api/v1/current-prod)"
            case "$status" in 000 | 429 | 502 | 503 | 504) [ "$attempt" -eq 3 ] || sleep $((attempt * 5)) ;; *) break ;; esac
          done
          case "$status" in
            200) echo "continuo API reachable and this repository is bound" ;;
            401 | 403)
              echo "::error::continuo refused this repository (HTTP $status). Check that RELEASE_ENDPOINT is exactly the origin of continuo's auth.publicUrl (the OIDC audience), and that this repository's id is listed in continuo's ciAuth.bindings for the service."
              exit 1 ;;
            *) fail_with_response "reading $CONTINUO_ORIGIN/api/v1/current-prod" "$status" ;;
          esac
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # PRECONDITION: continuo-python-runtime must be published to PyPI (this repo's release pipeline).
      # Until then, install from git: uv tool install git+https://github.com/carolsimone/continuo-python-runtime
      - name: Install runtime tooling
        run: uv tool install continuo-python-runtime
      # Fast feedback only: this only looks at scripts/. `continuo-runtime
      # merge` (below) independently lints the script plus its whole
      # in-repo import closure, so helpers outside scripts/ (e.g. lib/) are
      # covered even though this step never looks at them.
      - name: Lint scripts (no hand-written SQL)
        run: continuo-runtime lint scripts/
      # To check reads against the SQL dialect Continuo's install will actually
      # use (not just sqlglot's dialect-neutral parser), add --dialect <name>:
      # continuo-runtime validate contracts/ --dialect postgres
      - name: Validate contracts
        run: continuo-runtime validate contracts/
      - name: Domain tests
        run: |
          if [ -d tests ]; then uv run --with pytest pytest -v; fi
      - name: Compute release id
        run: echo "RELEASE_ID=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # As above, add --dialect <name> to check reads against your warehouse's dialect.
      - name: Merge contracts
        run: continuo-runtime merge contracts/ --service "$SERVICE" --repo-root . --out contract.yaml
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE="${{ vars.REGISTRY }}/${SERVICE}:${RELEASE_ID}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE_TAG=$IMAGE" >> "$GITHUB_ENV"
      - name: Upload contract artifact
        run: aws s3 cp contract.yaml "s3://${{ vars.BUCKET }}/${SERVICE}/${RELEASE_ID}/contract.yaml"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Strictly after build+push and upload: continuo does no existence check, so
      # a release that races its own artifacts fails at the parsing stage.
      #
      # Submits the release to continuo's public API and waits for its verdict.
      # Each call carries a fresh GitHub Actions OIDC token (see the preflight
      # step) whose audience is the origin of RELEASE_ENDPOINT. The token carries
      # `repo` and `commit_sha`, so the body leaves them out. Promoted is success;
      # rejected and superseded fail the job.
      - name: Submit release to continuo
        run: |
          resp="$(mktemp)"
          trap 'rm -f "$resp"' EXIT
          . "$RUNNER_TEMP/continuo-api.sh"

          body="$(jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg service "$SERVICE" \
            --arg image_tag "$IMAGE_TAG" \
            '{release_id: $release_id, service: $service, image_tag: $image_tag, kind: "python"}')"

          # A submit is idempotent on release_id, so transient failures are retried.
          for attempt in 1 2 3; do
            status="$(call POST /api/v1/releases "$body")"
            case "$status" in 000 | 429 | 502 | 503 | 504) [ "$attempt" -eq 3 ] || sleep $((attempt * 5)) ;; *) break ;; esac
          done
          [ "$status" = 202 ] || fail_with_response "submitting release $RELEASE_ID" "$status"
          echo "submitted release $RELEASE_ID (service=$SERVICE) to $CONTINUO_ORIGIN"

          # Poll to a terminal status: 300 polls x 10 s = 50 minutes.
          last=""
          for _ in $(seq 1 300); do
            status="$(call GET "/api/v1/releases/$RELEASE_ID")"
            case "$status" in
              200) ;;
              000 | 429 | 502 | 503 | 504) sleep 10; continue ;;
              *) fail_with_response "reading release $RELEASE_ID" "$status" ;;
            esac
            state="$(jq -r '.status // empty' "$resp")"
            if [ "$state" != "$last" ]; then echo "release $RELEASE_ID status: ${state:-unknown}"; last="$state"; fi
            if [ "$(jq -r '.terminal // false' "$resp")" = true ]; then
              ui_url="$(jq -r '.ui_url // empty' "$resp")"
              [ -z "$ui_url" ] || echo "details: $ui_url"
              case "$state" in
                promoted) exit 0 ;;
                rejected)
                  echo "::error::release $RELEASE_ID rejected: $(jq -r '"\(.reject_reason // "") \(.reject_detail // "")"' "$resp")"
                  exit 1 ;;
                superseded)
                  echo "::error::release $RELEASE_ID was superseded by a newer release before it could be promoted"
                  exit 1 ;;
                *)
                  echo "::error::release $RELEASE_ID ended with unexpected status '$state'"
                  exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::timed out waiting for release $RELEASE_ID to reach a terminal status (last: ${last:-unknown})"
          exit 1
