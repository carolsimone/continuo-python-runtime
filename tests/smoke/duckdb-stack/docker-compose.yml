# Tier-2 integration stack for adapters/duckdb: a DuckLake is a Postgres catalog
# plus Parquet data on S3, so this is postgres + minio. Used by the
# adapters/duckdb integration suite (`pytest adapters/duckdb/tests -m
# integration`) and by the Dockerfile.duckdb image smoke test. Non-default host
# ports (15599 catalog, 19100 S3) to avoid colliding with other local stacks.
# The catalog records its DATA_PATH on first attach, so `down -v` between runs
# that change it.
services:
  catalog:
    image: postgres:16
    environment:
      POSTGRES_USER: continuo
      POSTGRES_PASSWORD: continuo
      POSTGRES_DB: catalog
    ports:
      - "15599:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuo -d catalog"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    # ghcr mirror of Bitnami's minio image; its ENTRYPOINT is Bitnami's setup
    # script, so it is overridden to reach `minio` directly (see the trino
    # stack for the full reasoning).
    image: ghcr.io/carolsimone/continuo-minio:2025.7.23
    entrypoint: minio
    command: server /bitnami/minio/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19100:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  createbuckets:
    image: ghcr.io/carolsimone/continuo-mc:2025.7.21
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo bucket-ready
      "
