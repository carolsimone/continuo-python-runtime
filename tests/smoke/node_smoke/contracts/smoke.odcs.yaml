apiVersion: v3.2.0
kind: DataContract
id: analytics.smoke
name: smoke
version: "0"
team:
  name: platform
customProperties:
  - {vendor: continuo, property: schedule, value: daily}
  - {vendor: continuo, property: criticality, value: SECONDARY}
