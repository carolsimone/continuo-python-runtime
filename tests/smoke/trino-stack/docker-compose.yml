# Self-contained trino + iceberg-rest + minio stack, used by the
# Dockerfile.trino smoke test and by the adapters/trino integration suite
# (`pytest adapters/trino/tests -m integration`). Non-default host ports
# (18080/18181/19000) to avoid colliding with other local stacks.
services:
  minio:
    # ghcr mirror of Bitnami's minio image (Docker Hub's minio/minio is no
    # longer anonymously pullable). Its ENTRYPOINT is Bitnami's own setup
    # script, not the `minio` binary, so it's overridden here to reach
    # `minio` directly; the data dir is Bitnami's own /bitnami/minio/data
    # (writable by the image's non-root user) since plain /data doesn't
    # exist in this image.
    image: ghcr.io/carolsimone/continuo-minio:2025.7.23
    entrypoint: minio
    command: server /bitnami/minio/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  createbuckets:
    # ghcr mirror of Bitnami's mc image (Docker Hub's minio/mc is no longer
    # anonymously pullable). `mc` is on PATH, and the shell entrypoint below
    # already bypasses this image's own Bitnami entrypoint script, so no
    # further adaptation is needed beyond the image tag.
    image: ghcr.io/carolsimone/continuo-mc:2025.7.21
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo bucket-ready
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "18181:8181"

  trino:
    image: trinodb/trino:483
    depends_on:
      - iceberg-rest
    volumes:
      - ./catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "trino", "--execute", "SHOW SCHEMAS FROM iceberg"]
      interval: 5s
      timeout: 10s
      retries: 60
